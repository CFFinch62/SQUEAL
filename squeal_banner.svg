<ellipse cx="166" cy="200" rx="7" ry="9" fill="#7E4A45"/>
</g>
<text x="300" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="#F7C7C2" letter-spacing="4">SQUEAL</text>
<text x="302" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#C9A19E">SQL Interpreted Development Environment</text>
<text x="302" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#8A6664">Part of the Fragillidae IDE Suite 2</text>
